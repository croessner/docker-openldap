name: Publish Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  IMAGE_NAME: chrroessner/openldap
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docker:
    name: Publish OpenLDAP ${{ matrix.channel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel:
          - lts
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract release versions
        id: versions
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail

          source versions/alpine.env
          # shellcheck disable=SC1090
          source "versions/openldap-${CHANNEL}.env"
          release_tag=""

          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            candidate="${GITHUB_REF_NAME#v}"
            case "$candidate" in
              "${OPENLDAP_VERSION}"-r*) release_tag="$candidate" ;;
            esac
          fi

          {
            echo "alpine_version=${ALPINE_VERSION}"
            echo "openldap_channel=${OPENLDAP_CHANNEL}"
            echo "openldap_version=${OPENLDAP_VERSION}"
            echo "openldap_sha256=${OPENLDAP_SHA256}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Docker tags
        id: docker_tags
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.versions.outputs.openldap_version }}
          ALPINE_VERSION: ${{ steps.versions.outputs.alpine_version }}
          RELEASE_TAG: ${{ steps.versions.outputs.release_tag }}
        run: |
          set -euo pipefail

          {
            echo 'tags<<EOF'
            scripts/docker-tags.sh "$IMAGE_NAME" "$CHANNEL" "$VERSION" "$ALPINE_VERSION" "$RELEASE_TAG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            ALPINE_VERSION=${{ steps.versions.outputs.alpine_version }}
            OPENLDAP_CHANNEL=${{ steps.versions.outputs.openldap_channel }}
            OPENLDAP_VERSION=${{ steps.versions.outputs.openldap_version }}
            OPENLDAP_SHA256=${{ steps.versions.outputs.openldap_sha256 }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_URL=https://hub.docker.com/r/chrroessner/openldap
            OCI_DOCUMENTATION=${{ github.server_url }}/${{ github.repository }}#readme
            OCI_VERSION=${{ steps.versions.outputs.openldap_version }}
            OCI_REVISION=${{ github.sha }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=OpenLDAP Alpine
            org.opencontainers.image.description=OpenLDAP built from pinned source on Alpine Linux with env-driven bootstrap and optional persistent slapd.d support
            org.opencontainers.image.licenses=MIT AND OLDAP-2.8
            org.opencontainers.image.vendor=Rößner-Network-Solutions
            org.opencontainers.image.authors=Christian Rößner <christian@roessner.email>
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://hub.docker.com/r/chrroessner/openldap
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.version=${{ steps.versions.outputs.openldap_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.roessner.openldap.channel=${{ steps.versions.outputs.openldap_channel }}
          cache-from: type=gha,scope=openldap-${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=openldap-${{ matrix.channel }}
          attests: |
            type=provenance,mode=max
            type=sbom

      - name: Export SBOM files
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail

          mkdir -p dist/sbom
          image_ref="${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$image_ref" \
            --format '{{ json (index .SBOM "linux/amd64").SPDX }}' \
            > "dist/sbom/openldap-${CHANNEL}-linux-amd64.spdx.json"
          docker buildx imagetools inspect "$image_ref" \
            --format '{{ json (index .SBOM "linux/arm64").SPDX }}' \
            > "dist/sbom/openldap-${CHANNEL}-linux-arm64.spdx.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openldap-${{ matrix.channel }}-sbom-${{ github.run_id }}
          path: dist/sbom/*.json
          if-no-files-found: error

      - name: Sync Docker Hub description
        if: github.ref == 'refs/heads/main' && matrix.channel == 'lts'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: chrroessner/openldap
          short-description: OpenLDAP LTS and feature images on Alpine with env bootstrap and optional slapd.d mode.
