name: Check Upstream Releases

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - versions/**
      - .github/workflows/openldap-upstream-check.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-release-check
  cancel-in-progress: false

jobs:
  check-openldap:
    name: Check OpenLDAP ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: lts
            release_marker: Long Term Support Release
            manifest: versions/openldap-lts.env
            branch: automation/openldap-lts
          - channel: stable
            release_marker: Feature Release
            manifest: versions/openldap-stable.env
            branch: automation/openldap-stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect current OpenLDAP release
        id: upstream
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          MANIFEST: ${{ matrix.manifest }}
          RELEASE_MARKER: ${{ matrix.release_marker }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC1090
          source "$MANIFEST"
          current_version="$OPENLDAP_VERSION"
          current_sha256="$OPENLDAP_SHA256"
          current_revision="$IMAGE_REVISION"
          download_page_url="https://www.openldap.org/software/download/"
          release_index_url="https://www.openldap.org/software/download/OpenLDAP/openldap-release/"

          latest_version="$(
            curl -fsSL "$download_page_url" |
              sed -n "s/.*>${RELEASE_MARKER}<\\/SPAN>, OpenLDAP-\\([0-9.]*\\):.*/\\1/p" |
              head -n1
          )"

          if [[ ! "$latest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine the current OpenLDAP ${CHANNEL} release" >&2
            exit 1
          fi

          tarball_url="${release_index_url}openldap-${latest_version}.tgz"
          sha3_url="${release_index_url}openldap-${latest_version}.sha3-512"
          tarball="${RUNNER_TEMP}/openldap-${CHANNEL}.tgz"
          sha3_file="${RUNNER_TEMP}/openldap-${CHANNEL}.sha3-512"

          curl -fsSL "$tarball_url" -o "$tarball"
          latest_sha256="$(sha256sum "$tarball" | awk '{print $1}')"

          if curl -fsSL "$sha3_url" -o "$sha3_file"; then
            expected_sha3="$(sed 's/^.*= //' "$sha3_file" | tr '[:upper:]' '[:lower:]')"
            actual_sha3="$(openssl dgst -sha3-512 "$tarball" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
            [ "$expected_sha3" = "$actual_sha3" ]
          fi

          update_needed=false
          change_kind=none
          pr_title="chore: no OpenLDAP ${CHANNEL} update needed"

          if [ "$latest_version" != "$current_version" ]; then
            update_needed=true
            change_kind=version
            pr_title="chore: bump OpenLDAP ${CHANNEL} to ${latest_version}"
          elif [ "$latest_sha256" != "$current_sha256" ]; then
            update_needed=true
            change_kind=checksum
            pr_title="chore: refresh OpenLDAP ${CHANNEL} ${current_version} checksum"
          fi

          {
            echo "current_version=${current_version}"
            echo "current_sha256=${current_sha256}"
            echo "current_revision=${current_revision}"
            echo "latest_version=${latest_version}"
            echo "latest_sha256=${latest_sha256}"
            echo "tarball_url=${tarball_url}"
            echo "update_needed=${update_needed}"
            echo "change_kind=${change_kind}"
            echo "pr_title=${pr_title}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### OpenLDAP ${CHANNEL} upstream check"
            echo
            echo "- Current pin: \`${current_version}\`"
            echo "- Upstream release: \`${latest_version}\`"
            echo "- Update needed: \`${update_needed}\`"
            echo "- Tarball: ${tarball_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update OpenLDAP pin
        if: steps.upstream.outputs.update_needed == 'true'
        id: update
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          MANIFEST: ${{ matrix.manifest }}
          OLD_VERSION: ${{ steps.upstream.outputs.current_version }}
          OLD_SHA256: ${{ steps.upstream.outputs.current_sha256 }}
          OLD_REVISION: ${{ steps.upstream.outputs.current_revision }}
          NEW_VERSION: ${{ steps.upstream.outputs.latest_version }}
          NEW_SHA256: ${{ steps.upstream.outputs.latest_sha256 }}
          CHANGE_KIND: ${{ steps.upstream.outputs.change_kind }}
        run: |
          set -euo pipefail

          sed -i "s/^OPENLDAP_VERSION=.*/OPENLDAP_VERSION=${NEW_VERSION}/" "$MANIFEST"
          sed -i "s/^OPENLDAP_SHA256=.*/OPENLDAP_SHA256=${NEW_SHA256}/" "$MANIFEST"

          if [ "$CHANGE_KIND" = version ]; then
            new_revision="$(scripts/bump-image-revision.sh "$MANIFEST" reset)"
          else
            new_revision="$(scripts/bump-image-revision.sh "$MANIFEST" bump)"
          fi
          echo "new_revision=${new_revision}" >> "$GITHUB_OUTPUT"

          if [ "$CHANNEL" = lts ]; then
            sed -i "s/^ARG OPENLDAP_VERSION=.*/ARG OPENLDAP_VERSION=${NEW_VERSION}/" Dockerfile
            sed -i "s/^ARG OPENLDAP_SHA256=.*/ARG OPENLDAP_SHA256=${NEW_SHA256}/" Dockerfile
            sed -i "s/OPENLDAP_VERSION: \${OPENLDAP_VERSION:-${OLD_VERSION}}/OPENLDAP_VERSION: \${OPENLDAP_VERSION:-${NEW_VERSION}}/" examples/docker-compose.yml
            sed -i "s/OPENLDAP_SHA256: \${OPENLDAP_SHA256:-${OLD_SHA256}}/OPENLDAP_SHA256: \${OPENLDAP_SHA256:-${NEW_SHA256}}/" examples/docker-compose.yml
            sed -i "s/IMAGE_REVISION: \${IMAGE_REVISION:-${OLD_REVISION}}/IMAGE_REVISION: \${IMAGE_REVISION:-${new_revision}}/" examples/docker-compose.yml
            sed -i "s/^ARG IMAGE_REVISION=.*/ARG IMAGE_REVISION=${new_revision}/" Dockerfile
            sed -i "s/^ARG OPENLDAP_VERSION=.*/ARG OPENLDAP_VERSION=${NEW_VERSION}/" Dockerfile.debian
            sed -i "s/^ARG OPENLDAP_SHA256=.*/ARG OPENLDAP_SHA256=${NEW_SHA256}/" Dockerfile.debian
            sed -i "s/^ARG IMAGE_REVISION=.*/ARG IMAGE_REVISION=${new_revision}/" Dockerfile.debian
          fi

      - name: Create or update OpenLDAP pull request
        if: steps.upstream.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ matrix.branch }}
          add-paths: |
            ${{ matrix.manifest }}
            ${{ matrix.channel == 'lts' && 'Dockerfile' || '' }}
            ${{ matrix.channel == 'lts' && 'Dockerfile.debian' || '' }}
            ${{ matrix.channel == 'lts' && 'examples/docker-compose.yml' || '' }}
          delete-branch: true
          commit-message: ${{ steps.upstream.outputs.pr_title }}
          title: ${{ steps.upstream.outputs.pr_title }}
          body: |
            This automated PR updates only the OpenLDAP `${{ matrix.channel }}` channel.

            - Current pin: `${{ steps.upstream.outputs.current_version }}`
            - Upstream release: `${{ steps.upstream.outputs.latest_version }}`
            - Tarball: ${{ steps.upstream.outputs.tarball_url }}
            - Change type: `${{ steps.upstream.outputs.change_kind }}`
            - Image revision: `r${{ steps.update.outputs.new_revision }}`

            The LTS and feature/stable channels are intentionally handled by separate jobs and branches.
          assignees: croessner
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

  check-alpine:
    name: Check Alpine stable
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Detect current Alpine stable image
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          source versions/alpine.env
          current_version="$ALPINE_VERSION"
          current_digest="$ALPINE_DIGEST"
          metadata_url="https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/latest-releases.yaml"
          latest_version="$(
            curl -fsSL "$metadata_url" |
              sed -n 's/^  version: \([0-9][0-9.]*\)$/\1/p' |
              head -n1
          )"

          if [[ ! "$latest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine the current Alpine stable release" >&2
            exit 1
          fi

          latest_digest="$(
            docker buildx imagetools inspect "alpine:${latest_version}" --format '{{ json .Manifest }}' |
              jq -r '.digest'
          )"
          if [[ ! "$latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not determine the multiarch digest for alpine:${latest_version}" >&2
            exit 1
          fi

          update_needed=false
          change_kind=none
          pr_title="chore: no Alpine update needed"
          if [ "$latest_version" != "$current_version" ]; then
            update_needed=true
            change_kind=version
            pr_title="chore: bump Alpine to ${latest_version}"
          elif [ "$latest_digest" != "$current_digest" ]; then
            update_needed=true
            change_kind=digest
            pr_title="chore: refresh Alpine ${latest_version} image"
          fi

          {
            echo "current_version=${current_version}"
            echo "current_digest=${current_digest}"
            echo "latest_version=${latest_version}"
            echo "latest_digest=${latest_digest}"
            echo "metadata_url=${metadata_url}"
            echo "update_needed=${update_needed}"
            echo "change_kind=${change_kind}"
            echo "pr_title=${pr_title}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Alpine stable upstream check"
            echo
            echo "- Current image: \`${current_version}@${current_digest}\`"
            echo "- Latest image: \`${latest_version}@${latest_digest}\`"
            echo "- Update needed: \`${update_needed}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Alpine pin
        if: steps.upstream.outputs.update_needed == 'true'
        id: update
        shell: bash
        env:
          OLD_VERSION: ${{ steps.upstream.outputs.current_version }}
          NEW_VERSION: ${{ steps.upstream.outputs.latest_version }}
          OLD_DIGEST: ${{ steps.upstream.outputs.current_digest }}
          NEW_DIGEST: ${{ steps.upstream.outputs.latest_digest }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC1091
          source versions/openldap-lts.env
          old_lts_revision="$IMAGE_REVISION"

          sed -i "s/^ALPINE_VERSION=.*/ALPINE_VERSION=${NEW_VERSION}/" versions/alpine.env
          sed -i "s/^ALPINE_DIGEST=.*/ALPINE_DIGEST=${NEW_DIGEST}/" versions/alpine.env
          sed -i "s/^ARG ALPINE_VERSION=[0-9].*/ARG ALPINE_VERSION=${NEW_VERSION}/" Dockerfile
          sed -i "s/^ARG ALPINE_DIGEST=sha256:.*/ARG ALPINE_DIGEST=${NEW_DIGEST}/" Dockerfile
          # shellcheck disable=SC2016
          sed -i "s/ALPINE_VERSION: \${ALPINE_VERSION:-${OLD_VERSION}}/ALPINE_VERSION: \${ALPINE_VERSION:-${NEW_VERSION}}/" examples/docker-compose.yml
          # shellcheck disable=SC2016
          sed -i "s/ALPINE_DIGEST: \${ALPINE_DIGEST:-${OLD_DIGEST}}/ALPINE_DIGEST: \${ALPINE_DIGEST:-${NEW_DIGEST}}/" examples/docker-compose.yml

          lts_revision="$(scripts/bump-image-revision.sh versions/openldap-lts.env bump)"
          stable_revision="$(scripts/bump-image-revision.sh versions/openldap-stable.env bump)"
          sed -i "s/^ARG IMAGE_REVISION=.*/ARG IMAGE_REVISION=${lts_revision}/" Dockerfile
          # The revision is shared per channel, so the Debian defaults follow as well.
          sed -i "s/^ARG IMAGE_REVISION=.*/ARG IMAGE_REVISION=${lts_revision}/" Dockerfile.debian
          # shellcheck disable=SC2016
          sed -i "s/IMAGE_REVISION: \${IMAGE_REVISION:-${old_lts_revision}}/IMAGE_REVISION: \${IMAGE_REVISION:-${lts_revision}}/" examples/docker-compose.yml
          {
            echo "lts_revision=${lts_revision}"
            echo "stable_revision=${stable_revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Alpine pull request
        if: steps.upstream.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/alpine-stable
          delete-branch: true
          commit-message: ${{ steps.upstream.outputs.pr_title }}
          title: ${{ steps.upstream.outputs.pr_title }}
          body: |
            This automated PR updates the Alpine stable image used by both OpenLDAP channels and increments both image revisions. The revision is shared per channel, so the Debian variant is republished under the new revision as well.

            - Current image: `${{ steps.upstream.outputs.current_version }}@${{ steps.upstream.outputs.current_digest }}`
            - Latest image: `${{ steps.upstream.outputs.latest_version }}@${{ steps.upstream.outputs.latest_digest }}`
            - Change type: `${{ steps.upstream.outputs.change_kind }}`
            - LTS image revision: `r${{ steps.update.outputs.lts_revision }}`
            - Stable image revision: `r${{ steps.update.outputs.stable_revision }}`
            - Metadata: ${{ steps.upstream.outputs.metadata_url }}

            Merging this PR publishes new immutable `-rX` tags for both channels.
          assignees: croessner
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

  check-debian:
    name: Check Debian stable
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Detect current Debian stable image
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          source versions/debian.env
          current_version="$DEBIAN_VERSION"
          current_digest="$DEBIAN_DIGEST"
          # Stay within the pinned Debian major release. A new major changes package
          # names and belongs in a deliberate change, not in an automated PR.
          major="${current_version%%.*}"
          tags_url="https://hub.docker.com/v2/repositories/library/debian/tags?page_size=100&name=${major}."
          latest_version="$(
            curl -fsSL "$tags_url" |
              jq -r --arg major "$major" \
                '.results[].name | select(test("^" + $major + "\\.[0-9]+-slim$")) | sub("-slim$"; "")' |
              sort -t. -k2,2n |
              tail -n1
          )"

          if [[ ! "$latest_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine the current Debian ${major} point release" >&2
            exit 1
          fi

          latest_digest="$(
            docker buildx imagetools inspect "debian:${latest_version}-slim" --format '{{ json .Manifest }}' |
              jq -r '.digest'
          )"
          if [[ ! "$latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not determine the multiarch digest for debian:${latest_version}-slim" >&2
            exit 1
          fi

          update_needed=false
          change_kind=none
          pr_title="chore: no Debian update needed"
          if [ "$latest_version" != "$current_version" ]; then
            update_needed=true
            change_kind=version
            pr_title="chore: bump Debian to ${latest_version}"
          elif [ "$latest_digest" != "$current_digest" ]; then
            update_needed=true
            change_kind=digest
            pr_title="chore: refresh Debian ${latest_version} image"
          fi

          {
            echo "current_version=${current_version}"
            echo "current_digest=${current_digest}"
            echo "latest_version=${latest_version}"
            echo "latest_digest=${latest_digest}"
            echo "tags_url=${tags_url}"
            echo "update_needed=${update_needed}"
            echo "change_kind=${change_kind}"
            echo "pr_title=${pr_title}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Debian stable upstream check"
            echo
            echo "- Current image: \`${current_version}-slim@${current_digest}\`"
            echo "- Latest image: \`${latest_version}-slim@${latest_digest}\`"
            echo "- Update needed: \`${update_needed}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Debian pin
        if: steps.upstream.outputs.update_needed == 'true'
        id: update
        shell: bash
        env:
          NEW_VERSION: ${{ steps.upstream.outputs.latest_version }}
          NEW_DIGEST: ${{ steps.upstream.outputs.latest_digest }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC1091
          source versions/openldap-lts.env
          old_lts_revision="$IMAGE_REVISION"

          sed -i "s/^DEBIAN_VERSION=.*/DEBIAN_VERSION=${NEW_VERSION}/" versions/debian.env
          sed -i "s/^DEBIAN_DIGEST=.*/DEBIAN_DIGEST=${NEW_DIGEST}/" versions/debian.env
          sed -i "s/^ARG DEBIAN_VERSION=[0-9].*/ARG DEBIAN_VERSION=${NEW_VERSION}/" Dockerfile.debian
          sed -i "s/^ARG DEBIAN_DIGEST=sha256:.*/ARG DEBIAN_DIGEST=${NEW_DIGEST}/" Dockerfile.debian

          # A new base means a new immutable image, so both channels get a new
          # revision. The revision is shared by both variants of a channel.
          lts_revision="$(scripts/bump-image-revision.sh versions/openldap-lts.env bump)"
          stable_revision="$(scripts/bump-image-revision.sh versions/openldap-stable.env bump)"
          sed -i "s/^ARG IMAGE_REVISION=.*/ARG IMAGE_REVISION=${lts_revision}/" Dockerfile
          sed -i "s/^ARG IMAGE_REVISION=.*/ARG IMAGE_REVISION=${lts_revision}/" Dockerfile.debian
          # shellcheck disable=SC2016
          sed -i "s/IMAGE_REVISION: \${IMAGE_REVISION:-${old_lts_revision}}/IMAGE_REVISION: \${IMAGE_REVISION:-${lts_revision}}/" examples/docker-compose.yml
          {
            echo "lts_revision=${lts_revision}"
            echo "stable_revision=${stable_revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Debian pull request
        if: steps.upstream.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/debian-stable
          delete-branch: true
          commit-message: ${{ steps.upstream.outputs.pr_title }}
          title: ${{ steps.upstream.outputs.pr_title }}
          body: |
            This automated PR updates the Debian base image used by the Debian variant of both OpenLDAP channels and increments both image revisions. The revision is shared per channel, so the Alpine variant is republished under the new revision as well.

            - Current image: `${{ steps.upstream.outputs.current_version }}-slim@${{ steps.upstream.outputs.current_digest }}`
            - Latest image: `${{ steps.upstream.outputs.latest_version }}-slim@${{ steps.upstream.outputs.latest_digest }}`
            - Change type: `${{ steps.upstream.outputs.change_kind }}`
            - LTS image revision: `r${{ steps.update.outputs.lts_revision }}`
            - Stable image revision: `r${{ steps.update.outputs.stable_revision }}`
            - Tag source: ${{ steps.upstream.outputs.tags_url }}

            Merging this PR publishes new immutable `-rX` tags for both channels in both variants.
          assignees: croessner
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
